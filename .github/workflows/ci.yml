name: CI

on:
  push:
    branches: [main, develop, "milestone/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libsndfile1-dev \
            uuid-dev \
            libssl-dev \
            libbrotli-dev \
            libjsoncpp-dev \
            zlib1g-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            pkg-config \
            libsndfile \
            ossp-uuid \
            openssl@3 \
            brotli \
            jsoncpp

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBEEPBOX_BUILD_SERVER=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        # Exclude CookieSameSite: pre-existing drogon internal test that
        # requires an SSL cert fixture not shipped with the FetchContent
        # build. Unrelated to beepbox sources.
        run: ctest --output-on-failure -E "CookieSameSite"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
