name: Deploy to Cloud Run

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        type: choice
        options:
          - dev
          - prod
        default: dev
      image_tag:
        description: "Image tag to deploy (e.g. v0.1.0 or sha-abc1234). Empty = derive from sha."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  SERVICE: beepbox-server

jobs:
  deploy:
    name: Build & deploy to ${{ inputs.target || 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target config
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TARGET=prod
            TAG="${{ github.event.release.tag_name }}"
          else
            TARGET="${{ inputs.target }}"
            TAG="${{ inputs.image_tag }}"
            if [ -z "$TAG" ]; then
              TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
            fi
          fi
          PROJECT="beeping-platform-${TARGET}"
          AR="europe-west1-docker.pkg.dev/${PROJECT}/beepbox"
          echo "target=$TARGET"             >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT"           >> "$GITHUB_OUTPUT"
          echo "ar=$AR"                     >> "$GITHUB_OUTPUT"
          echo "image=$AR/beepbox-server:$TAG" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (${{ steps.cfg.outputs.target }})
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.target == 'prod' && secrets.WIF_PROVIDER_PROD || secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ steps.cfg.outputs.target == 'prod' && secrets.WIF_SA_PROD || secrets.WIF_SA_DEV }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for AR
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.cfg.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ steps.cfg.outputs.project }}
          image: ${{ steps.cfg.outputs.image }}

      - name: Smoke test
        id: smoke
        run: |
          echo "Testing: ${{ steps.deploy.outputs.url }}"
          sleep 10
          bash scripts/smoke.sh "${{ steps.deploy.outputs.url }}"

      - name: Rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke tests failed — rolling back ${{ steps.cfg.outputs.target }}..."
          PREV_REV=$(gcloud run revisions list \
            --service=${{ env.SERVICE }} \
            --project=${{ steps.cfg.outputs.project }} \
            --region=${{ env.REGION }} \
            --format="value(name)" \
            --sort-by="~creationTimestamp" \
            --limit=2 | tail -1)
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --project=${{ steps.cfg.outputs.project }} \
            --region=${{ env.REGION }} \
            --to-revisions="${PREV_REV}=100"
          echo "Rolled back to $PREV_REV in ${{ steps.cfg.outputs.target }}"
